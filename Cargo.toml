[workspace]
members = [
    "crates/*"
]
resolver = "2"

[workspace.package]
authors = ["Arkhe Team"]
license = "MIT"
repository = "https://github.com/arkhe/arkhe"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
blake3 = "1.5"
hex = "0.4"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
reqwest = "0.12"
tokio-test = "0.4"
tempfile = "3.10"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
